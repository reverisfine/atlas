<script>
(function(){
  const n=parseInt(new URLSearchParams(location.search).get('l'),10)||0;
  const L=LESSONS.find(x=>x.n===n&&x.ready);
  const go=()=>{const s=document.createElement('script');s.src='assets/typing.js';document.body.appendChild(s);};
  if(L){const d=document.createElement('script');d.src='data/lesson'+PAD(n)+'.js';d.onload=go;document.body.appendChild(d);}
  else go();
})();
</script>
